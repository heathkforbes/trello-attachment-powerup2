<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />

    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 12px;
      }

      button {
        display: block;
        margin-bottom: 10px;
        padding: 8px 12px;
        cursor: pointer;
      }

      pre {
        font-family: monospace;
        white-space: pre-wrap;
        word-break: break-word;
        background: #f4f4f4;
        padding: 10px;
        border-radius: 6px;
        max-height: 400px;
        overflow: auto;
      }
    </style>
  </head>

  <body>
    <button id="download-json">Download JSON</button>
    <button id="download-attachments">Download all attachments</button>

    <pre id="output">Loading...</pre>

    <script src="https://p.trellocdn.com/power-up.min.js"></script>

    <script>
      const t = window.TrelloPowerUp.iframe();

      const attachments = t.arg("attachments") || [];
      const jsonText = JSON.stringify(attachments, null, 2);

      document.getElementById("output").textContent = jsonText;

      function safeFileName(name, index) {
        if (!name) {
          return "attachment-" + index;
        }

        return name
          .replace(/[<>:"/\\|?*]+/g, "-")
          .replace(/\s+/g, " ")
          .trim();
      }

      document
        .getElementById("download-json")
        .addEventListener("click", function () {
          const blob = new Blob([jsonText], {
            type: "application/json"
          });

          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");

          a.href = url;
          a.download = "attachments.json";
          a.click();

          URL.revokeObjectURL(url);
        });

      document
        .getElementById("download-attachments")
        .addEventListener("click", function () {
          if (!attachments.length) {
            alert("No attachments found on this card.");
            return;
          }

          const confirmed = confirm(
            "This will attempt to download " +
              attachments.length +
              " attachment(s). Your browser may ask you to allow multiple downloads."
          );

          if (!confirmed) {
            return;
          }

          attachments.forEach(function (attachment, index) {
            setTimeout(function () {
              const a = document.createElement("a");

              a.href = attachment.url;
              a.download = safeFileName(attachment.name, index + 1);
              a.target = "_blank";

              document.body.appendChild(a);
              a.click();
              document.body.removeChild(a);
            }, index * 500);
          });
        });

      t.sizeTo("body");
    </script>
  </body>
</html>
