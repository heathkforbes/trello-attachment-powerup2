<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />

    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 12px;
      }

      label {
        font-weight: bold;
      }

      input {
        width: 100%;
        box-sizing: border-box;
        margin: 6px 0 10px 0;
        padding: 8px;
      }

      button {
        display: block;
        margin-bottom: 10px;
        padding: 8px 12px;
        cursor: pointer;
      }

      pre {
        font-family: monospace;
        white-space: pre-wrap;
        word-break: break-word;
        background: #f4f4f4;
        padding: 10px;
        border-radius: 6px;
        max-height: 300px;
        overflow: auto;
      }

      #status {
        margin: 10px 0;
        font-weight: bold;
      }
    </style>
  </head>

  <body>
    <label for="token">Trello token:</label>
    <input id="token" type="password" placeholder="Paste Trello token here" />

    <button id="download-json">Download JSON</button>
    <button id="download-zip">Download all attachments as ZIP</button>

    <div id="status">Ready.</div>

    <pre id="output">Loading...</pre>

    <script src="https://p.trellocdn.com/power-up.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <script>
      const APP_KEY = "9cd9af876d2fa7e06cf13dda583a6575";

      const t = window.TrelloPowerUp.iframe();

      const attachments = t.arg("attachments") || [];
      const cardId = t.arg("cardId");
      const cardName = t.arg("cardName") || "trello-card";

      const jsonText = JSON.stringify(
        {
          cardId: cardId,
          cardName: cardName,
          attachments: attachments
        },
        null,
        2
      );

      document.getElementById("output").textContent = jsonText;

      function setStatus(message) {
        document.getElementById("status").textContent = message;
      }

      function safeFileName(name, index) {
        const fallback = "attachment-" + index;

        return (name || fallback)
          .replace(/[<>:"/\\|?*]+/g, "-")
          .replace(/\s+/g, " ")
          .trim();
      }

      function downloadBlob(blob, filename) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");

        a.href = url;
        a.download = filename;

        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);

        URL.revokeObjectURL(url);
      }

      document
        .getElementById("download-json")
        .addEventListener("click", function () {
          const blob = new Blob([jsonText], {
            type: "application/json"
          });

          downloadBlob(blob, safeFileName(cardName, 1) + "-attachments.json");
        });

      document
        .getElementById("download-zip")
        .addEventListener("click", async function () {
          const token = document.getElementById("token").value.trim();

          if (!token) {
            alert("Paste your Trello token first.");
            return;
          }

          if (!attachments.length) {
            alert("No attachments found on this card.");
            return;
          }

          const zip = new JSZip();

          zip.file("attachments.json", jsonText);

          setStatus("Starting ZIP download...");

          for (let i = 0; i < attachments.length; i++) {
            const attachment = attachments[i];
            const fileName = safeFileName(attachment.name, i + 1);

            setStatus(
              "Downloading " +
                (i + 1) +
                " of " +
                attachments.length +
                ": " +
                fileName
            );

            try {
              const downloadUrl =
                "https://api.trello.com/1/cards/" +
                cardId +
                "/attachments/" +
                attachment.id +
                "/download/" +
                encodeURIComponent(attachment.name) +
                "?key=" +
                APP_KEY +
                "&token=" +
                token;

              const response = await fetch(downloadUrl);

              if (!response.ok) {
                throw new Error("HTTP " + response.status);
              }

              const blob = await response.blob();

              zip.file(fileName, blob);
            } catch (error) {
              zip.file(
                "FAILED-" + fileName + ".txt",
                "Could not download this attachment.\n\nURL:\n" +
                  attachment.url +
                  "\n\nError:\n" +
                  error.message
              );
            }
          }

          setStatus("Creating ZIP file...");

          const zipBlob = await zip.generateAsync({
            type: "blob"
          });

          setStatus("Downloading ZIP...");

          downloadBlob(zipBlob, safeFileName(cardName, 1) + "-attachments.zip");

          setStatus("Done.");
        });

      t.sizeTo("body");
    </script>
  </body>
</html>
