<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />

    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 12px;
      }

      label {
        font-weight: bold;
      }

      input {
        width: 100%;
        box-sizing: border-box;
        margin: 6px 0 10px 0;
        padding: 8px;
      }

      button {
        display: block;
        margin-bottom: 10px;
        padding: 8px 12px;
        cursor: pointer;
      }

      pre {
        font-family: monospace;
        white-space: pre-wrap;
        word-break: break-word;
        background: #f4f4f4;
        padding: 10px;
        border-radius: 6px;
        max-height: 300px;
        overflow: auto;
      }

      #status {
        margin: 10px 0;
        font-weight: bold;
      }
    </style>
  </head>

  <body>
    <label for="token">Trello token:</label>

    <input
      id="token"
      type="password"
      placeholder="Paste Trello token here"
    />

    <button id="download-json">
      Download JSON
    </button>

    <button id="download-local">
      Download attachments ZIP to laptop
    </button>

    <div id="status">
      Ready.
    </div>

    <pre id="output">
Loading...
    </pre>

    <script src="https://p.trellocdn.com/power-up.min.js"></script>

    <script>
      const t = window.TrelloPowerUp.iframe();

      const attachments = t.arg("attachments") || [];
      const cardId = t.arg("cardId");
      const cardName = t.arg("cardName") || "trello-card";

      const jsonData = {
        cardId: cardId,
        cardName: cardName,
        attachments: attachments
      };

      const jsonText = JSON.stringify(jsonData, null, 2);

      document.getElementById("output").textContent = jsonText;

      function setStatus(message) {
        document.getElementById("status").textContent = message;
      }

      function safeFileName(name) {
        return (name || "trello-card")
          .replace(/[<>:"/\\|?*]+/g, "-")
          .replace(/\s+/g, " ")
          .trim();
      }

      function downloadBlob(blob, filename) {
        const url = URL.createObjectURL(blob);

        const a = document.createElement("a");

        a.href = url;
        a.download = filename;

        document.body.appendChild(a);

        a.click();

        document.body.removeChild(a);

        URL.revokeObjectURL(url);
      }

      document
        .getElementById("download-json")
        .addEventListener("click", function () {

          const blob = new Blob(
            [jsonText],
            { type: "application/json" }
          );

          downloadBlob(
            blob,
            safeFileName(cardName) + "-attachments.json"
          );
        });

      document
        .getElementById("download-local")
        .addEventListener("click", async function () {

          const token =
            document
              .getElementById("token")
              .value
              .trim();

          if (!token) {
            alert("Paste your Trello token first.");
            return;
          }

          setStatus("Sending job to local helper...");

          try {

            const response = await fetch(
              http://localhost:8765/download-card-attachments,
              {
                method: "POST",

                headers: {
                  "Content-Type": "application/json"
                },

                body: JSON.stringify({
                  token: token,
                  cardId: cardId,
                  cardName: cardName,
                  attachments: attachments
                })
              }
            );

            const result = await response.json();

            if (!response.ok || !result.ok) {
              throw new Error(
                result.error || "Unknown server error"
              );
            }

            setStatus(
              "ZIP saved to Downloads folder:\n" +
              result.path
            );

            alert(
              "ZIP download completed successfully."
            );

          } catch (error) {

            console.error(error);

            setStatus(
              "ERROR:\n" + error.message
            );

            alert(
              "Could not connect to local helper.\n\n" +
              "Make sure Python server is running."
            );
          }
        });

      t.sizeTo("body");
    </script>
  </body>
</html>
